<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Báo cáo & Dashboard | Điều hành công việc</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        gov: {50:'#f3f8fd',100:'#e5f1fb',200:'#c7e1f6',300:'#94c5eb',400:'#59a4dc',500:'#1d75b0',600:'#1d75b0',700:'#1d75b0',800:'#1560c0',900:'#0e4d8a',950:'#0e3060'},
        tealx:{500:'#1fa3ad',600:'#17858e'},
        successx:'#3f9b72', warningx:'#ed8d23', dangerx:'#c94b4b'
      },
      boxShadow:{soft:'0 8px 24px rgba(15,23,42,.06)'}
    }
  }
}
</script>
<style>
  body{font-family:Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif}
  .nav-item{color:#dbeafe}.nav-item:hover{background:rgba(255,255,255,.10);color:#fff}.nav-item.active{background:#1560c0;color:#fff;font-weight:700;}
  .thin-scroll::-webkit-scrollbar{width:7px;height:7px}.thin-scroll::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:8px}
</style>
</head>
<body class="bg-slate-50 text-slate-800">

<aside class="hidden lg:flex fixed inset-y-0 left-0 w-72 bg-[#0e3060] border-r border-[#0b2851] flex-col z-30 text-white">
  <div class="min-h-20 px-4 py-3 flex items-center border-b border-white/10">
    <img src="assets/logo-quan-ly-cong-viec.svg" alt="Logo Hệ thống quản lý công việc" class="w-12 h-12 rounded-full shrink-0 ring-2 ring-white/20 shadow-sm">
    <div class="ml-3 leading-tight"><div class="font-extrabold text-white text-[13px] tracking-wide">HỆ THỐNG QUẢN LÝ</div><div class="font-extrabold text-white text-[13px] tracking-wide mt-0.5">CÔNG VIỆC</div></div>
  </div>
  <nav class="p-3 text-sm space-y-1">
    <a data-nav="dashboard" href="index.html" class="nav-item flex items-center gap-3 px-3 py-2.5 rounded-lg"><i data-lucide="layout-dashboard" class="w-4 h-4"></i>Bảng điều hành</a>
    <a data-nav="inbox" href="tiep-nhan-ai.html" class="nav-item flex items-center gap-3 px-3 py-2.5 rounded-lg"><i data-lucide="inbox" class="w-4 h-4"></i>Văn bản đến</a>
    <a data-nav="tasks" href="nhiem-vu.html" class="nav-item flex items-center gap-3 px-3 py-2.5 rounded-lg"><i data-lucide="list-checks" class="w-4 h-4"></i>Nhiệm vụ</a>
    <a data-nav="reports" href="bao-cao.html" class="nav-item flex items-center gap-3 px-3 py-2.5 rounded-lg"><i data-lucide="bar-chart-3" class="w-4 h-4"></i>Báo cáo</a>
  </nav>
  <div class="mt-auto p-4 border-t border-white/10">
    <div class="rounded-xl bg-white/10 p-3 text-xs text-blue-100">
      Phiên bản giao diện mẫu 1.0
    </div>
  </div>
</aside>

<div class="lg:ml-72 min-h-screen">
<header class="h-16 bg-white border-b border-slate-200 sticky top-0 z-20 flex items-center justify-between px-4 md:px-6">
  <div>
    <h1 id="pageTitle" class="font-bold text-gov-900 text-lg"></h1>
    <p id="pageSub" class="text-xs text-slate-500 hidden md:block"></p>
  </div>
  <div class="flex items-center gap-2">
    <button class="relative w-9 h-9 rounded-lg border border-slate-200 grid place-items-center hover:bg-slate-50"><i data-lucide="bell" class="w-4 h-4"></i><span class="absolute -top-1 -right-1 w-4 h-4 bg-dangerx text-white text-[10px] rounded-full grid place-items-center">3</span></button>
    <div class="hidden sm:flex items-center gap-2 pl-2">
      <div class="w-9 h-9 rounded-full bg-gov-700 text-white grid place-items-center text-xs font-bold">NV</div>
      <div class="text-sm"><div class="font-semibold">Nguyễn Văn A</div><div class="text-xs text-slate-500">Lãnh đạo đơn vị</div></div>
    </div>
  </div>
</header>

<main class="p-4 md:p-6 max-w-[1600px] mx-auto">
<div class="bg-white border rounded-2xl shadow-soft p-4 mb-5">
 <div class="grid md:grid-cols-5 gap-3 text-sm">
  <select class="border rounded-lg p-2.5"><option>Tháng</option><option>Tuần</option><option>Quý</option><option>Năm</option><option>Từ ngày - đến ngày</option></select>
  <input type="date" value="2026-10-01" class="border rounded-lg p-2.5">
  <input type="date" value="2026-10-31" class="border rounded-lg p-2.5">
  <select class="border rounded-lg p-2.5"><option>Tất cả đơn vị</option><option>Phòng Tổng hợp</option></select>
  <button class="bg-gov-700 text-white rounded-lg">Xem báo cáo</button>
 </div>
</div>
<div class="grid md:grid-cols-4 gap-4 mb-5">
 <div class="bg-white border rounded-2xl p-4"><div class="text-sm text-slate-500">Tổng nhiệm vụ</div><div class="text-3xl font-bold text-gov-800">128</div></div>
 <div class="bg-white border rounded-2xl p-4"><div class="text-sm text-slate-500">Tỷ lệ hoàn thành</div><div class="text-3xl font-bold text-emerald-600">55,5%</div></div>
 <div class="bg-white border rounded-2xl p-4"><div class="text-sm text-slate-500">Đúng hạn</div><div class="text-3xl font-bold text-[#1d75b0]">71</div></div>
 <div class="bg-white border rounded-2xl p-4"><div class="text-sm text-slate-500">Quá hạn</div><div class="text-3xl font-bold text-red-600">6</div></div>
</div>
<div class="grid xl:grid-cols-2 gap-5">
 <div class="bg-white border rounded-2xl p-5 shadow-soft"><div class="flex justify-between"><h3 class="font-bold text-gov-900">Nhiệm vụ theo đơn vị</h3><button class="text-sm border rounded-lg px-3 py-1.5">Xuất Excel</button></div><canvas id="barChart" height="140" class="mt-4"></canvas></div>
 <div class="bg-white border rounded-2xl p-5 shadow-soft"><div class="flex justify-between"><h3 class="font-bold text-gov-900">Tỷ lệ trạng thái</h3><button class="text-sm border rounded-lg px-3 py-1.5">Xuất PDF</button></div><canvas id="pieChart" height="140" class="mt-4"></canvas></div>
</div>
</main>
</div>
<script>
document.getElementById('pageTitle').textContent="B\u00e1o c\u00e1o & Dashboard";
document.getElementById('pageSub').textContent="Truy xu\u1ea5t theo nhi\u1ec7m v\u1ee5, k\u1ebf ho\u1ea1ch v\u00e0 kho\u1ea3ng th\u1eddi gian";
document.querySelector('[data-nav="reports"]')?.classList.add('active');
lucide.createIcons();
</script>
<script>
new Chart(document.getElementById('barChart'),{type:'bar',data:{labels:['Tổng hợp','Pháp chế','Nghiệp vụ','Văn phòng','CNTT'],datasets:[{label:'Nhiệm vụ',data:[32,24,29,21,22],backgroundColor:'#1d75b0',borderRadius:6}]},options:{scales:{y:{beginAtZero:true}},plugins:{legend:{display:false}}}});
new Chart(document.getElementById('pieChart'),{type:'pie',data:{labels:['Hoàn thành','Đang thực hiện','Sắp hạn','Quá hạn'],datasets:[{data:[71,42,9,6],backgroundColor:['#3f9b72','#1d75b0','#ed8d23','#c94b4b'],borderWidth:0}]},options:{plugins:{legend:{position:'bottom'}}}});
</script>
</body></html>
